classification_rules:
- Existing SUM measures map to the existing total_<column> simple metrics.
- Other aggregations require new native measures before a simple metric can reference them.
- Arithmetic definitions are derived-metric candidates only after all inputs are native and grain-compatible.
- Window, cohort, bucket, set, and query-exact logic remains in the query layer unless the native type fully represents it.
