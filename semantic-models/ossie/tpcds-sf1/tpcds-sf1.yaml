      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: cc_call_center_sk
      description: Surrogate key component identifying the call center row.
      datatype: Integer
      ai_context:
        instructions: 'Semantic role: primary key. Not nullable.'
      dimension:
        is_time: false
    - name: cc_call_center_id
