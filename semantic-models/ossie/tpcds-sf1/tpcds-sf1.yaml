  - name: catalog_sales
    source: tpcds.public.catalog_sales
    primary_key:
    - cs_item_sk
    - cs_order_number
    unique_keys:
    - - cs_item_sk
      - cs_order_number
    description: 'Catalog order line items with billing, shipping, fulfillment, promotion, and financial measures. Grain:
      One catalog sales line per item and order number.'
    ai_context:
      instructions: Use role-specific billing and shipping dimension keys. Extended amounts and quantity are additive; unit
        prices and unit cost are not additive. Use ship date for fulfillment timing and sold date for demand timing.
    fields:
    - name: cs_sold_date_sk
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: cs_sold_date_sk
      description: Surrogate key to Date; sale date.
      datatype: Integer
      ai_context:
        instructions: 'Semantic role: foreign key. Nullable.'
      dimension:
        is_time: true
    - name: cs_sold_time_sk
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: cs_sold_time_sk
      description: Surrogate key to Time; sale time.
      datatype: Integer
