    description: 'Returned catalog line items, refund roles, return reasons, and financial effects. Grain: One returned catalog
      line item per item and order number.'
    ai_context:
      instructions: Join to catalog sales with both item key and order number. Returning-customer and refunded-customer roles
        are distinct. Return amounts and quantities are additive; unit-level interpretations must come from the matching sale
        line.
    fields:
