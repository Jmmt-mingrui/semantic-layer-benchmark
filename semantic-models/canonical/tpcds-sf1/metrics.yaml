version: 0.1.0
status: candidate
benchmark: tpcds-derived
scale_factor: 1
dataset_contexts: dataset-contexts.yaml

sources:
  questions: benchmark/tpcds/questions/canonical/questions.jsonl
  reference_sql: benchmark/tpcds/sql/reference/postgres/
  logical_specification: https://www.tpc.org/tpc_documents_current_versions/pdf/tpc-ds_v4.0.0.pdf
  precedence: official_toolkit_template_then_reference_sql_then_question_paraphrase

naming_rules:
  - Metric IDs describe business meaning and retain the sales channel when formulas differ by channel.
  - Extended sales price is called sales revenue; unit sales price summed across rows is called sales price sum.
  - Counts identify their counted entity or row grain.
  - Ranking, filtering, bucketing, and threshold comparison are analysis operations, not standalone metrics.
  - Query-exact metrics preserve unusual benchmark formulas without presenting them as general business definitions.

execution_contract:
  database_independent: true
  relation_names:
    policy: logical_dataset_names_only
    runtime_namespace_source: runner/config/database.yaml
  grain:
    policy: aggregate_each_fact_at_the_requested_output_grain_before_cross_fact_join
    reject_implicit_many_to_many_fact_joins: true
  dimensions:
    policy: dimensions_must_be_reachable_from_each_input_dataset_through_declared_relationships
    preserve_role_playing_dimensions: true
  time:
    sales_default: sold_date
    returns_default: returned_date
    inventory_default: snapshot_date
    fulfillment_default: shipped_date
    require_explicit_time_role_when_ambiguous: true
  filters:
    policy: apply_before_aggregation_unless_the_question_requires_post_aggregate_filtering
    preserve_null_predicates: true
  nulls:
    additive_aggregates: sql_standard
    derived_arithmetic: propagate_null
    missing_cross_channel_value: do_not_coalesce_unless_explicitly_required
  division:
    zero_denominator: null
    implementation_pattern: numerator / NULLIF(denominator, 0)
  precision:
    currency: decimal
    ratios: decimal
    rounding: only_when_explicit_in_reference_sql_or_question
  additivity:
    additive: may_sum_across_declared_dimensions_and_time
    non_additive: recompute_from_base_inputs_at_requested_grain
    semi_additive: never_sum_across_snapshot_time
  provenance:
    formula_precedence: official_toolkit_template_then_reference_sql_then_question_paraphrase
    reference_sql_dialect: postgres
    runtime_default_dialect: duckdb

metric_families:
  - id: sales_revenue
    label: Sales revenue
    kind: base
    value_type: currency
    additivity: additive
    definition: Sum of the channel's extended sales price at sales-line grain.
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_ext_sales_price)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_ext_sales_price)"}
      web: {dataset: web_sales, expression: "SUM(ws_ext_sales_price)"}

  - id: sales_price_sum
    label: Sales price sum
    kind: base
    value_type: currency
    additivity: query_defined
    definition: Sum of the per-line sales-price column. Kept distinct from sales revenue.
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_sales_price)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_sales_price)"}
      web: {dataset: web_sales, expression: "SUM(ws_sales_price)"}

  - id: list_value_sales
    label: Quantity-weighted list value
    kind: base_expression
    value_type: currency
    additivity: additive
    definition: Sum of quantity multiplied by list price.
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_quantity * ss_list_price)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_quantity * cs_list_price)"}
      web: {dataset: web_sales, expression: "SUM(ws_quantity * ws_list_price)"}

  - id: gross_sales_value
    label: Quantity-weighted sales value
    kind: base_expression
    value_type: currency
    additivity: additive
    definition: Sum of quantity multiplied by sales price.
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_quantity * ss_sales_price)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_quantity * cs_sales_price)"}
      web: {dataset: web_sales, expression: "SUM(ws_quantity * ws_sales_price)"}

  - id: sales_quantity
    label: Sales quantity
    kind: base
    value_type: quantity
    additivity: additive
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_quantity)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_quantity)"}
      web: {dataset: web_sales, expression: "SUM(ws_quantity)"}

  - id: list_price_sum
    label: List price sum
    kind: base
    value_type: currency
    additivity: query_defined
    definition: Sum of unit list prices; retained only because benchmark queries use it directly.
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_list_price)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_list_price)"}
      web: {dataset: web_sales, expression: "SUM(ws_list_price)"}

  - id: wholesale_cost_sum
    label: Wholesale cost sum
    kind: base
    value_type: currency
    additivity: query_defined
    definition: Sum of unit wholesale-cost values; not a generally additive revenue measure.
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_wholesale_cost)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_wholesale_cost)"}
      web: {dataset: web_sales, expression: "SUM(ws_wholesale_cost)"}

  - id: extended_wholesale_cost
    label: Extended wholesale cost
    kind: base
    value_type: currency
    additivity: additive
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_ext_wholesale_cost)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_ext_wholesale_cost)"}
      web: {dataset: web_sales, expression: "SUM(ws_ext_wholesale_cost)"}

  - id: extended_list_price
    label: Extended list price
    kind: base
    value_type: currency
    additivity: additive
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_ext_list_price)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_ext_list_price)"}
      web: {dataset: web_sales, expression: "SUM(ws_ext_list_price)"}

  - id: sales_after_discount
    label: Extended list price after discount
    kind: base_expression
    value_type: currency
    additivity: additive
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_ext_list_price - ss_ext_discount_amt)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_ext_list_price - cs_ext_discount_amt)"}
      web: {dataset: web_sales, expression: "SUM(ws_ext_list_price - ws_ext_discount_amt)"}

  - id: net_paid
    label: Net paid
    kind: base
    value_type: currency
    additivity: additive
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_net_paid)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_net_paid)"}
      web: {dataset: web_sales, expression: "SUM(ws_net_paid)"}

  - id: net_profit
    label: Net profit
    kind: base
    value_type: currency
    additivity: additive
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_net_profit)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_net_profit)"}
      web: {dataset: web_sales, expression: "SUM(ws_net_profit)"}

  - id: discount_amount
    label: Extended discount amount
    kind: base
    value_type: currency
    additivity: additive
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_ext_discount_amt)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_ext_discount_amt)"}
      web: {dataset: web_sales, expression: "SUM(ws_ext_discount_amt)"}

  - id: coupon_amount
    label: Coupon amount
    kind: base
    value_type: currency
    additivity: additive
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_coupon_amt)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_coupon_amt)"}
      web: {dataset: web_sales, expression: "SUM(ws_coupon_amt)"}

  - id: extended_tax
    label: Extended sales tax
    kind: base
    value_type: currency
    additivity: additive
    variants:
      store: {dataset: store_sales, expression: "SUM(ss_ext_tax)"}
      catalog: {dataset: catalog_sales, expression: "SUM(cs_ext_tax)"}
      web: {dataset: web_sales, expression: "SUM(ws_ext_tax)"}

  - id: shipping_cost
    label: Extended shipping cost
    kind: base
    value_type: currency
    additivity: additive
    variants:
      catalog: {dataset: catalog_sales, expression: "SUM(cs_ext_ship_cost)"}
      web: {dataset: web_sales, expression: "SUM(ws_ext_ship_cost)"}

  - id: return_amount
    label: Return amount
    kind: base
    value_type: currency
    additivity: additive
    variants:
      store: {dataset: store_returns, expression: "SUM(sr_return_amt)"}
      catalog: {dataset: catalog_returns, expression: "SUM(cr_return_amount)"}
      web: {dataset: web_returns, expression: "SUM(wr_return_amt)"}

  - id: return_amount_including_tax
    label: Return amount including tax
    kind: base
    value_type: currency
    additivity: additive
    variants:
      store: {dataset: store_returns, expression: "SUM(sr_return_amt_inc_tax)"}
      catalog: {dataset: catalog_returns, expression: "SUM(cr_return_amt_inc_tax)"}
      web: {dataset: web_returns, expression: "SUM(wr_return_amt_inc_tax)"}

  - id: return_quantity
    label: Return quantity
    kind: base
    value_type: quantity
    additivity: additive
    variants:
      store: {dataset: store_returns, expression: "SUM(sr_return_quantity)"}
      catalog: {dataset: catalog_returns, expression: "SUM(cr_return_quantity)"}
      web: {dataset: web_returns, expression: "SUM(wr_return_quantity)"}

  - id: return_net_loss
    label: Return net loss
    kind: base
    value_type: currency
    additivity: additive
    variants:
      store: {dataset: store_returns, expression: "SUM(sr_net_loss)"}
      catalog: {dataset: catalog_returns, expression: "SUM(cr_net_loss)"}
      web: {dataset: web_returns, expression: "SUM(wr_net_loss)"}

  - id: refunded_cash
    label: Refunded cash
    kind: base
    value_type: currency
    additivity: additive
    variants:
      store: {dataset: store_returns, expression: "SUM(sr_refunded_cash)"}
      catalog: {dataset: catalog_returns, expression: "SUM(cr_refunded_cash)"}
      web: {dataset: web_returns, expression: "SUM(wr_refunded_cash)"}

  - id: return_fee
    label: Return fee
    kind: base
    value_type: currency
    additivity: additive
    variants:
      store: {dataset: store_returns, expression: "SUM(sr_fee)"}
      catalog: {dataset: catalog_returns, expression: "SUM(cr_fee)"}
      web: {dataset: web_returns, expression: "SUM(wr_fee)"}

  - id: inventory_quantity_on_hand
    label: Inventory quantity on hand
    kind: base
    value_type: quantity
    additivity: semi_additive
    default_aggregation: none
    constraint: May aggregate across items or warehouses at one snapshot, but not blindly across dates.
    variants:
      inventory: {dataset: inventory, expression: inv_quantity_on_hand}

  - id: sales_row_count
    label: Sales row count
    kind: count
    value_type: count
    additivity: additive
    variants:
      store: {dataset: store_sales, expression: "COUNT(*)"}
      catalog: {dataset: catalog_sales, expression: "COUNT(*)"}
      web: {dataset: web_sales, expression: "COUNT(*)"}

  - id: distinct_order_count
    label: Distinct order count
    kind: count_distinct
    value_type: count
    additivity: non_additive
    variants:
      catalog: {dataset: catalog_sales, expression: "COUNT(DISTINCT cs_order_number)"}
      web: {dataset: web_sales, expression: "COUNT(DISTINCT ws_order_number)"}

  - id: customer_count
    label: Customer count
    kind: count_distinct
    value_type: count
    additivity: non_additive
    definition: Distinct customers after the question-specific channel and date constraints.

  - id: item_count
    label: Item count
    kind: count_distinct
    value_type: count
    additivity: non_additive

  - id: non_null_value_count
    label: Non-null value count
    kind: count
    value_type: count
    additivity: additive
    expression: "COUNT(<field>)"

  - id: distinct_value_count
    label: Distinct value count
    kind: count_distinct
    value_type: count
    additivity: non_additive
    expression: "COUNT(DISTINCT <field>)"

  - id: average_sales_quantity
    label: Average sales quantity
    kind: average
    value_type: quantity
    additivity: non_additive
    variants:
      store: {dataset: store_sales, expression: "AVG(ss_quantity)"}
      catalog: {dataset: catalog_sales, expression: "AVG(cs_quantity)"}
      web: {dataset: web_sales, expression: "AVG(ws_quantity)"}

  - id: average_return_quantity
    label: Average return quantity
    kind: average
    value_type: quantity
    additivity: non_additive
    variants:
      store: {dataset: store_returns, expression: "AVG(sr_return_quantity)"}
      catalog: {dataset: catalog_returns, expression: "AVG(cr_return_quantity)"}
      web: {dataset: web_returns, expression: "AVG(wr_return_quantity)"}

  - id: average_list_price
    label: Average list price
    kind: average
    value_type: currency
    additivity: non_additive
    variants:
      store: {dataset: store_sales, expression: "AVG(ss_list_price)"}
      catalog: {dataset: catalog_sales, expression: "AVG(cs_list_price)"}
      web: {dataset: web_sales, expression: "AVG(ws_list_price)"}

  - id: average_coupon_amount
    label: Average coupon amount
    kind: average
    value_type: currency
    additivity: non_additive
    variants:
      store: {dataset: store_sales, expression: "AVG(ss_coupon_amt)"}
      catalog: {dataset: catalog_sales, expression: "AVG(cs_coupon_amt)"}
      web: {dataset: web_sales, expression: "AVG(ws_coupon_amt)"}

  - id: average_sales_price
    label: Average sales price
    kind: average
    value_type: currency
    additivity: non_additive
    variants:
      store: {dataset: store_sales, expression: "AVG(ss_sales_price)"}
      catalog: {dataset: catalog_sales, expression: "AVG(cs_sales_price)"}
      web: {dataset: web_sales, expression: "AVG(ws_sales_price)"}

  - id: average_net_profit
    label: Average net profit
    kind: average
    value_type: currency
    additivity: non_additive
    variants:
      store: {dataset: store_sales, expression: "AVG(ss_net_profit)"}
      catalog: {dataset: catalog_sales, expression: "AVG(cs_net_profit)"}
      web: {dataset: web_sales, expression: "AVG(ws_net_profit)"}

  - id: average_extended_sales_price
    label: Average extended sales price
    kind: average
    value_type: currency
    additivity: non_additive
    variants:
      store: {dataset: store_sales, expression: "AVG(ss_ext_sales_price)"}
      catalog: {dataset: catalog_sales, expression: "AVG(cs_ext_sales_price)"}
      web: {dataset: web_sales, expression: "AVG(ws_ext_sales_price)"}

  - id: average_extended_wholesale_cost
    label: Average extended wholesale cost
    kind: average
    value_type: currency
    additivity: non_additive
    variants:
      store: {dataset: store_sales, expression: "AVG(ss_ext_wholesale_cost)"}
      catalog: {dataset: catalog_sales, expression: "AVG(cs_ext_wholesale_cost)"}
      web: {dataset: web_sales, expression: "AVG(ws_ext_wholesale_cost)"}

  - id: average_extended_discount_amount
    label: Average extended discount amount
    kind: average
    value_type: currency
    additivity: non_additive
    variants:
      store: {dataset: store_sales, expression: "AVG(ss_ext_discount_amt)"}
      catalog: {dataset: catalog_sales, expression: "AVG(cs_ext_discount_amt)"}
      web: {dataset: web_sales, expression: "AVG(ws_ext_discount_amt)"}

  - id: average_net_paid
    label: Average net paid
    kind: average
    value_type: currency
    additivity: non_additive
    variants:
      store: {dataset: store_sales, expression: "AVG(ss_net_paid)"}
      catalog: {dataset: catalog_sales, expression: "AVG(cs_net_paid)"}
      web: {dataset: web_sales, expression: "AVG(ws_net_paid)"}

  - id: average_inventory_quantity
    label: Average inventory quantity on hand
    kind: average
    value_type: quantity
    additivity: non_additive
    expression: "AVG(inventory.inv_quantity_on_hand)"

  - id: quantity_stddev
    label: Quantity sample standard deviation
    kind: standard_deviation
    value_type: quantity
    additivity: non_additive
    variants:
      store_sales: {dataset: store_sales, expression: "STDDEV_SAMP(ss_quantity)"}
      catalog_sales: {dataset: catalog_sales, expression: "STDDEV_SAMP(cs_quantity)"}
      web_sales: {dataset: web_sales, expression: "STDDEV_SAMP(ws_quantity)"}
      store_returns: {dataset: store_returns, expression: "STDDEV_SAMP(sr_return_quantity)"}
      catalog_returns: {dataset: catalog_returns, expression: "STDDEV_SAMP(cr_return_quantity)"}
      web_returns: {dataset: web_returns, expression: "STDDEV_SAMP(wr_return_quantity)"}

  - id: inventory_quantity_stddev
    label: Inventory quantity standard deviation
    kind: standard_deviation
    value_type: quantity
    additivity: non_additive
    expression: "STDDEV_SAMP(inventory.inv_quantity_on_hand)"

derived_metrics:
  - id: all_channel_sales_revenue
    label: All-channel sales revenue
    kind: derived
    value_type: currency
    expression: sales_revenue.store + sales_revenue.catalog + sales_revenue.web

  - id: all_channel_sales_quantity
    label: All-channel sales quantity
    kind: derived
    value_type: quantity
    expression: sales_quantity.store + sales_quantity.catalog + sales_quantity.web

  - id: all_channel_return_amount
    label: All-channel return amount
    kind: derived
    value_type: currency
    expression: return_amount.store + return_amount.catalog + return_amount.web

  - id: all_channel_return_quantity
    label: All-channel return quantity
    kind: derived
    value_type: quantity
    expression: return_quantity.store + return_quantity.catalog + return_quantity.web

  - id: all_channel_net_profit
    label: All-channel net profit
    kind: derived
    value_type: currency
    expression: net_profit.store + net_profit.catalog + net_profit.web

  - id: all_channel_return_net_loss
    label: All-channel return net loss
    kind: derived
    value_type: currency
    expression: return_net_loss.store + return_net_loss.catalog + return_net_loss.web

  - id: net_sales_amount
    label: Net sales amount after returns
    kind: derived_template
    value_type: currency
    expression: sales_revenue.<channel> - COALESCE(return_amount.<channel>, 0)

  - id: net_sales_quantity
    label: Net sales quantity after returns
    kind: derived_template
    value_type: quantity
    expression: sales_quantity.<channel> - COALESCE(return_quantity.<channel>, 0)

  - id: net_profit_after_return_loss
    label: Net profit after return loss
    kind: derived_template
    value_type: currency
    expression: net_profit.<channel> - COALESCE(return_net_loss.<channel>, 0)

  - id: sales_share_pct
    label: Sales share
    kind: ratio
    value_type: percentage
    expression: 100 * selected_sales / parent_total_sales

  - id: growth_ratio
    label: Period-over-period growth ratio
    kind: ratio
    value_type: ratio
    expression: current_period_value / NULLIF(previous_period_value, 0)

  - id: growth_delta
    label: Period-over-period absolute change
    kind: derived_template
    expression: current_period_value - previous_period_value

  - id: gross_margin_ratio
    label: Gross profit margin
    kind: ratio
    value_type: ratio
    expression: net_profit / NULLIF(sales_revenue, 0)

  - id: return_ratio_quantity
    label: Return ratio by quantity
    kind: ratio
    value_type: ratio
    expression: return_quantity / NULLIF(sales_quantity, 0)

  - id: return_ratio_amount
    label: Return ratio by amount
    kind: ratio
    value_type: ratio
    expression: return_amount / NULLIF(net_paid, 0)

  - id: promotion_sales_share_pct
    label: Promotional sales share
    kind: ratio
    value_type: percentage
    expression: 100 * promotional_sales_revenue / NULLIF(all_sales_revenue, 0)

  - id: monthly_average
    label: Average monthly value
    kind: window_average
    expression: AVG(monthly_value) OVER (PARTITION BY yearly_parent_grain)

  - id: deviation_from_average_pct
    label: Percentage deviation from average
    kind: ratio
    value_type: percentage
    expression: 100 * (value - average_value) / NULLIF(average_value, 0)

  - id: coefficient_of_variation_pct
    label: Coefficient of variation
    kind: ratio
    value_type: percentage
    expression: 100 * inventory_quantity_stddev / NULLIF(average_inventory_quantity, 0)

  - id: inventory_change_pct
    label: Inventory percentage change
    kind: ratio
    value_type: percentage
    expression: 100 * (after_quantity - before_quantity) / NULLIF(before_quantity, 0)

  - id: sales_per_square_foot
    label: Sales per square foot
    kind: ratio
    expression: sales_value / NULLIF(warehouse_square_feet, 0)

  - id: elapsed_days_bucket_count
    label: Elapsed-days bucket count
    kind: conditional_count
    value_type: count
    buckets: [up_to_30_days, 31_to_60_days, 61_to_90_days, 91_to_120_days, over_120_days]

  - id: time_window_count_ratio
    label: Time-window count ratio
    kind: ratio
    value_type: ratio
    expression: first_window_count / NULLIF(second_window_count, 0)

  - id: channel_overlap_count
    label: Channel purchase-overlap count
    kind: conditional_count
    value_type: count
    variants: [first_channel_only, second_channel_only, both_channels]

  - id: cumulative_sales_price
    label: Cumulative sales-price sum
    kind: cumulative
    expression: "SUM(sales_price_sum) OVER (PARTITION BY item ORDER BY date ROWS UNBOUNDED PRECEDING)"

query_exact_metrics:
  - id: q04_customer_spend_proxy
    label: Query 04 customer spend proxy
    value_type: currency
    warning: This benchmark formula is not equivalent to standard revenue or net-paid metrics.
    variants:
      store: "SUM(((ss_ext_list_price - ss_ext_wholesale_cost - ss_ext_discount_amt) + ss_ext_sales_price) / 2)"
      catalog: "SUM(((cs_ext_list_price - cs_ext_wholesale_cost - cs_ext_discount_amt) + cs_ext_sales_price) / 2)"
      web: "SUM(((ws_ext_list_price - ws_ext_wholesale_cost - ws_ext_discount_amt) + ws_ext_sales_price) / 2)"

  - id: q14_average_line_list_value
    label: Query 14 average line list value
    expression: "AVG(quantity * list_price) across unioned channel lines"

  - id: q21_inventory_before_after_quantity
    label: Query 21 inventory quantity before and after price change
    expression: Conditional SUM(inv_quantity_on_hand) on each side of PRICE_CHANGE_DATE

  - id: q40_catalog_net_sales_before_after
    label: Query 40 catalog sales net of refunded cash before and after price change
    expression: "Conditional SUM(cs_sales_price - COALESCE(cr_refunded_cash, 0))"

  - id: q64_catalog_sale_to_refund_ratio
    label: Query 64 catalog sale-to-refund qualification
    expression: "SUM(cs_ext_list_price) / NULLIF(SUM(cr_refunded_cash + cr_reversed_charge + cr_store_credit), 0)"

  - id: q66_warehouse_monthly_sales_value
    label: Query 66 warehouse monthly sales value
    warning: Preserves the benchmark's quantity multiplication exactly.
    variants:
      web: "SUM(ws_ext_sales_price * ws_quantity)"
      catalog: "SUM(cs_sales_price * cs_quantity)"

  - id: q66_warehouse_monthly_net_value
    label: Query 66 warehouse monthly net value
    warning: Preserves the benchmark's quantity multiplication exactly.
    variants:
      web: "SUM(ws_net_paid * ws_quantity)"
      catalog: "SUM(cs_net_paid_inc_tax * cs_quantity)"

  - id: q85_average_web_return_values
    label: Query 85 average web return values
    expressions:
      average_web_sales_quantity: "AVG(ws_quantity)"
      average_refunded_cash: "AVG(wr_refunded_cash)"
      average_return_fee: "AVG(wr_fee)"

  - id: q93_actual_store_sales_after_return
    label: Query 93 store sales value after returned quantity
    expression: "SUM((ss_quantity - COALESCE(sr_return_quantity, 0)) * ss_sales_price)"
