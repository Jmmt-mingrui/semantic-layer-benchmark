[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-layer-benchmark"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.4.0",
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
semantic-benchmark = "runner.cli:main"

[tool.setuptools.packages.find]
include = ["runner*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
